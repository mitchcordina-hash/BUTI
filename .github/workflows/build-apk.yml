name: Build BUTI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore BUTI signing key
        env:
          BUTI_KEYSTORE_BASE64: ${{ secrets.BUTI_KEYSTORE_BASE64 }}
        run: echo "$BUTI_KEYSTORE_BASE64" | base64 --decode > buti-release.jks

      - name: Build signed release APK
        env:
          BUTI_STORE_PASSWORD: ${{ secrets.BUTI_STORE_PASSWORD }}
          BUTI_KEY_PASSWORD: ${{ secrets.BUTI_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload BUTI v1.1.1 release APK
        uses: actions/upload-artifact@v4
        with:
         name: BUTI-v1.1.1-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
